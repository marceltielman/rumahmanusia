<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title, description, canonical, Open Graph and JSON-LD are applied by
       provideSeo() during prerender, driven by the Sanity content. The title
       here is only a fallback if that ever fails. -->
  <title>Rumah Manusia — We Understand Human</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#00aeef">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&display=swap">
  <script>
    /* Resolve the theme before first paint so a dark-mode reload does not flash white. */
    (function () {
      try {
        var t = localStorage.getItem('rm-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <rm-root></rm-root>
</body>
</html>
